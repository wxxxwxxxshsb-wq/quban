<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>趣伴 QuBan</title>
<meta name="theme-color" content="#050608">
<link rel="icon" href="/logo.svg">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-orbit orbit-one"></div><div class="splash-orbit orbit-two"></div>
  <div class="splash-core"><img src="/logo.svg" alt=""><span class="splash-flare"></span></div>
  <div class="splash-wordmark">趣伴 <span>X · QUBAN</span></div>
  <div class="splash-caption">MAKE EVERY MOMENT COUNT</div>
  <div class="splash-progress"><i></i></div>
</div>
<div id="app">
  <nav id="nav">
    <div class="brand"><img src="/logo.svg" alt="趣伴"><span>趣伴</span></div>
    <button data-tab="home"><i>🏠</i><span>今天</span></button>
    <button data-tab="chat"><i>💬</i><span>聊天</span><em id="dot" hidden></em></button>
    <button data-tab="games"><i>🎮</i><span>游戏</span></button>
    <button data-tab="tools"><i>🧰</i><span>工具</span></button>
    <button data-tab="me"><i>🙂</i><span>我的</span></button>
  </nav>
  <main id="main"></main>
</div>
<div id="auth" hidden></div>
<div id="toast"></div>
<script>(()=>{const s=document.getElementById('splash');try{if(localStorage.getItem('qb_intro_seen')){s.remove();return}localStorage.setItem('qb_intro_seen','1')}catch{}setTimeout(()=>{if(s){s.classList.add('leaving');setTimeout(()=>s.remove(),620)}},1750)})()</script>
<script src="/app.js"></script>
</body>
</html>
